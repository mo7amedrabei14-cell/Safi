# Claudex Loop Configuration — SafiData v5.0 Gold Master (Section 19.2 & 20.1 #11)
version: "5.0.0"
source: "github.com/chaseai-yt/claudex-loop"
project: "safi"
brand_display: "صافي البيانات | SafiData"

workflow:
  strict_task_isolation: true
  forbid_next_task_auto_start: true
  steps:
    - id: read_context
      description: "Read AGENTS.md, docs/tasks/<id>.md, and referenced docs/spec/*.md files."
      required_files:
        - "AGENTS.md"
        - "docs/tasks/{task_id}.md"
    - id: write_plan
      description: "Write docs/plans/<id>.md BEFORE writing implementation code."
      output: "docs/plans/{task_id}.md"
    - id: implement
      description: "Implement strictly within current task scope; zero TODOs, zero placeholders, exact pinned versions."
    - id: verify_gate
      description: "Execute full verification gate including check-no-network, fmt, lint, tests, Codeburn, Cloudflare Security, and Strix."
      command: "make check"
    - id: write_owner_report
      description: "Write docs/reports/<id>.md in simple Arabic following .agents/skills/i-have-adhd/SKILL.md."
      output: "docs/reports/{task_id}.md"
    - id: stop_and_wait
      description: "Halt execution completely and wait for explicit owner acceptance."
      halt: true
