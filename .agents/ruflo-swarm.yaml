# Ruflo Swarm Configuration — SafiData v5.0 Gold Master (Section 20.1 #12)
version: "5.0.0"
source: "github.com/ruvnet/ruflo"
topology: "hierarchical-4-specialist"

agents:
  - id: rust-engine-agent
    name: "وكيل محرك Rust"
    scope:
      - "crates/sf-*"
      - "errors.toml"
      - "recipe.schema.json"
    constraints:
      - "Zero network access (enforced by tools/check-no-network.sh)"
      - "Byte-identical deterministic output"
      - "Edition 2024, zero clippy warnings"
    skills:
      - "cloudflare-security"
      - "i-have-adhd"

  - id: react-ui-agent
    name: "وكيل واجهة React"
    scope:
      - "apps/web/**"
      - "packages/**"
    constraints:
      - "Zero Next.js (Vite 6 + React 19 + TanStack Router)"
      - "RTL-first, Tailwind CSS v4 tokens only, WCAG 2.2 AA"
      - "Click alternative for every drag interaction"
    skills:
      - "ui-ux-pro-max"
      - "i-have-adhd"
      - "knowledge-work"

  - id: axum-pg18-server-agent
    name: "وكيل خادم Axum وPostgreSQL 18"
    active_from_slice: "S4"
    scope:
      - "server/**"
    constraints:
      - "Zero Supabase (Native PostgreSQL 18 with uuidv7(), Async I/O, Virtual Generated Columns, RLS)"
      - "Never store or log user file contents"
    skills:
      - "cloudflare-security"
      - "i-have-adhd"

  - id: security-audit-agent
    name: "وكيل الأمان والاختبار"
    scope:
      - "tests/**"
      - "tools/**"
      - "docs/SECURITY.md"
      - "docs/THREAT_MODEL.md"
    constraints:
      - "Mandatory gate at every task and slice"
      - "Run Cloudflare Security Audit Skill, Strix AI Pentesting, and Codeburn"
    skills:
      - "cloudflare-security"
      - "i-have-adhd"
