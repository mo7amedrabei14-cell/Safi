name: SafiData CI Gate (v5.0 Gold Master)

on:
  push:
    branches: ["main", "feat/**", "task/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Full Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain (Edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile, ignore-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run full verification gate (make check)
        shell: bash
        run: make check

  desktop-shell:
    name: Desktop shell compile (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (Edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile, ignore-scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the embedded web UI
        shell: bash
        run: pnpm -r --filter @safi/web run build

      - name: Check formatting and compile the Tauri 2.2 shell
        shell: bash
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

  intro-visual:
    name: Intro visual regression (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build production web app
        run: pnpm -r --filter @safi/web run build

      - name: Install pinned Playwright Chromium
        run: |
          npm install --prefix /tmp/safi-playwright --no-save --no-package-lock playwright@1.56.1
          /tmp/safi-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify cold-load intro in Chromium
        env:
          PLAYWRIGHT_MODULE_URL: file:///tmp/safi-playwright/node_modules/playwright/index.mjs
        run: node tools/verify-intro-visual.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safidata-intro-visual-evidence
          path: artifacts/intro-visual/
          if-no-files-found: warn
          retention-days: 7
