name: One-time Prettier Formatting

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format-once]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.8.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply repository Prettier rules
        run: >
          pnpm exec prettier --write
          apps/web/src/components/studios/CleaningStudio.tsx
          apps/web/src/pages/OwnerDashboard.tsx
          apps/web/src/components/home/LivePipelineVisualizer.test.tsx
          apps/web/src/components/studios/studios.test.tsx
          apps/web/src/App.shell.test.tsx
          apps/web/src/s1-integration.test.ts
          apps/web/src/boot-screen.test.tsx
          packages/brand/src/brand.test.ts
      - name: Commit formatting on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "chore(format): format English locale test and owner changes [format-once]"
            git push origin HEAD:main
          fi
