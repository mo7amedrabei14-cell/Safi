name: One-time repository formatting repair

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format tracked workspace sources
        run: |
          pnpm run format
          cargo fmt --all
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Commit formatting changes to main
        run: |
          if git diff --quiet; then
            echo "Workspace formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages apps .agents package.json tsconfig.base.json crates tools docs
          git commit -m "style: apply repository formatters"
          git push origin HEAD:main
