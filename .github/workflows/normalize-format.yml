name: Temporary repository formatting normalization

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/normalize-format.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply repository formatters only
        run: make fmt

      - name: Verify formatting and whitespace
        run: |
          make fmt-check
          git diff --check

      - name: Commit formatting-only changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Repository already matches all configured formatters."
          else
            git diff --cached --stat
            git commit -m "style: normalize workspace formatting"
            git push origin HEAD:main
          fi
