name: P0.02 one-time App formatter

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/src/App.tsx"
      - ".github/workflows/p0-02-app-prettier.yml"

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[P0.02-app-format]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Format App.tsx and commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --write apps/web/src/App.tsx
          git add apps/web/src/App.tsx
          git rm .github/workflows/p0-02-app-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(web): format App verification handoff"
          git push origin HEAD:main
