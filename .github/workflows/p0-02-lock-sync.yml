name: P0.02 one-time Cargo lock sync

on:
  push:
    branches: ["main"]
    paths:
      - "crates/sf-server/Cargo.toml"

permissions:
  contents: write

jobs:
  lock:
    if: contains(github.event.head_commit.message, '[P0.02-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and compile the pinned server dependencies
        run: cargo check -p sf-server

      - name: Commit the generated lockfile and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p0-02-lock-sync.yml
          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(auth): lock P0.02 authentication dependencies"
          git push origin HEAD:main
