name: P0.02 one-time code and catalog normalization

on:
  push:
    branches: ["main"]
    paths:
      - "crates/sf-server/src/auth/account.rs"
      - "crates/sf-server/src/error.rs"
      - "apps/web/src/components/layout/AccountAccessSheet.tsx"
      - "errors.toml"
      - ".github/workflows/p0-02-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: contains(github.event.head_commit.message, '[P0.02-normalize]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Normalize task files and regenerate error catalogs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          pnpm install --frozen-lockfile --ignore-scripts
          cargo fmt --all
          pnpm exec prettier --write apps/web/src/components/layout/AccountAccessSheet.tsx
          python3 tools/gen-errors.py
          git add crates/sf-server/src/auth/account.rs
          git add crates/sf-server/src/error.rs
          git add apps/web/src/components/layout/AccountAccessSheet.tsx
          git add crates/sf-core/src/generated_errors.rs
          git add packages/i18n/src/generated-errors.ts
          git rm .github/workflows/p0-02-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(auth): normalize account code and regenerate error catalogs"
          git push origin HEAD:main
