name: P0.02 one-time PostgreSQL test formatter

on:
  push:
    branches: ["main"]
    paths:
      - "crates/sf-server/tests/account_postgres.rs"
      - ".github/workflows/p0-02-rustfmt-postgres-test.yml"

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[P0.02-pgtest-format]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt to the new integration test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rustfmt --edition 2021 crates/sf-server/tests/account_postgres.rs
          git add crates/sf-server/tests/account_postgres.rs
          git rm .github/workflows/p0-02-rustfmt-postgres-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(test): apply rustfmt to PostgreSQL account proof"
          git push origin HEAD:main
