name: P0.02 one-time Rust format

on:
  push:
    branches: ["main"]
    paths:
      - "crates/sf-server/src/auth/**"
      - "crates/sf-server/src/routes.rs"

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[P0.02-rustfmt]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Format P0.02 Rust files and commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add crates/sf-server/src/auth/account.rs
          git add crates/sf-server/src/auth/mod.rs
          git add crates/sf-server/src/auth/repository.rs
          git add crates/sf-server/src/auth/service.rs
          git add crates/sf-server/src/routes.rs
          git rm .github/workflows/p0-02-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(auth): format P0.02 Rust implementation"
          git push origin HEAD:main
