name: Temporary canonical error catalog generation

on:
  push:
    paths:
      - ".github/workflows/regenerate-errors.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate canonical catalogs from errors.toml
        run: python tools/gen-errors.py --generate

      - name: Verify generated catalogs
        run: |
          python tools/gen-errors.py --check
          rustfmt --edition 2024 --check crates/sf-core/src/generated_errors.rs
          pnpm exec prettier --check packages/i18n/src/generated-errors.ts

      - name: Upload generated catalog files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safi-generated-error-catalogs
          if-no-files-found: error
          path: |
            crates/sf-core/src/generated_errors.rs
            packages/i18n/src/generated-errors.ts
