[package]
name = "safi-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"
description = "SafiData desktop shell (Tauri 2.2) with a strict command and permission allowlist."
publish = false

[build-dependencies]
serde_json = "=1.0.135"
sf-desktop = { path = "../../../crates/sf-desktop" }
tauri-build = { version = "=2.2.0", features = [] }

[dependencies]
serde_json = "=1.0.135"
sf-desktop = { path = "../../../crates/sf-desktop" }
tauri = { version = "=2.2.0", features = [] }
tauri-plugin-deep-link = "=2.2.0"
tauri-plugin-dialog = "=2.2.0"
tauri-plugin-single-instance = "=2.2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The shell is a standalone desktop application, not part of the engine workspace:
# building it needs the platform webview toolchain that the library crates do not.
[workspace]
