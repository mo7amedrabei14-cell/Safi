          <div class="safi-intro-progress-fill"></div>
        </div>

          type="button"
          class="safi-intro-skip"
          disabled
          tabindex="-1"
          aria-hidden="true"
          data-locale-aria-en="Enter SafiData"
          data-locale-aria-ar="الدخول إلى الموقع"
