[package]
name = "sf-cli"
version = "5.0.0"
edition = "2021"
publish = false

[dependencies]
sf-core = { path = "../sf-core" }
sf-io = { path = "../sf-io" }
sf-clean = { path = "../sf-clean" }
sf-profile = { path = "../sf-profile" }
sf-recipe = { path = "../sf-recipe" }
sf-report = { path = "../sf-report" }
sf-desktop = { path = "../sf-desktop" }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
uuid = { version = "=1.10.0", features = ["serde", "v7"] }
