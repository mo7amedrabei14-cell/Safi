[package]
name = "sf-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "SafiData desktop shell security policy: local-only content, deep-link allowlist, IPC limits, SQLCipher vault (sections 8.3, 8.6, 10.2, H4)."

[dependencies]
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
ed25519-dalek = { version = "2.1", features = ["serde"] }
hex = "0.4"
rand = "0.8"

[dev-dependencies]
serde_json = "=1.0.135"
tempfile = "3.14"

[lints]
workspace = true
