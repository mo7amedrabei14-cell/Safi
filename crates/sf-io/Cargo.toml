[package]
name = "sf-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
sf-core = { path = "../sf-core", version = "=0.1.0" }
csv = "=1.3.1"
encoding_rs = "=0.8.35"
chardetng = "=0.1.7"
calamine = "=0.26.1"
# XLSX needs deflate only; zstd/bzip2 are native libraries that cannot cross-compile to
# wasm and were never required by this reader.
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
quick-xml = "=0.31.0"

[lints]
workspace = true
