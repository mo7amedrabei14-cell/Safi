[package]
name = "sf-server"
version = "5.0.0"
edition = "2021"

[dependencies]
async-trait = "=0.1.92"
axum = "=0.8.4"
blake3 = "=1.5.5"
hex = "=0.4.3"
redis = { version = "=0.32.7", default-features = false, features = ["tokio-comp"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "uuid"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["full"] }
uuid = { version = "=1.10.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
