# Strix AI Pentesting Runner Configuration — SafiData v5.0 Gold Master (Section 20.1 #22)
version: "5.0.0"
source: "github.com/usestrix/strix"
project: "safi"
slice: "S1"

policies:
  fail_on_severity: ["critical", "high"]
  forbid_real_user_data_in_tests: true

suites:
  - id: s1-engine-network-isolation
    title: "Engine Zero-Network Isolation Check"
    target: "crates/sf-*"
    Verification: "tools/check-no-network.sh"
    severity: "critical"

  - id: s1-formula-injection-neutralization
    title: "CSV/XLSX Formula Injection Neutralization"
    target: "crates/sf-clean"
    payloads:
      - "=CMD|' /C calc'!A0"
      - "+SUM(1+1)*cmd|' /C calc'!A0"
      - "-2+3+cmd|' /C calc'!A0"
      - "@SUM(1+1)*cmd|' /C calc'!A0"
      - "\t=1+1"
      - "\r=1+1"
    expected: "Leading formula trigger characters are neutralized safely on export."
    severity: "critical"

  - id: s1-zip-bomb-and-size-limits
    title: "Parser Decompression Ratio & Size Limit Enforcement (SF-IMP-005)"
    target: "crates/sf-io"
    max_compression_ratio: 100
    web_max_bytes: 262144000
    desktop_max_bytes: 10737418240
    expected_error_code: "SF-IMP-005"
    severity: "high"

  - id: s1-strict-csp-and-supply-chain
    title: "Strict CSP & Exact Dependency Pinning Audit"
    target: "apps/web"
    forbid_directives: ["unsafe-inline", "unsafe-eval"]
    require_exact_versions: true
    require_ignore_scripts: true
    severity: "high"
